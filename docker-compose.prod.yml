services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    volumes:
      - cadence_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKER_USERNAME:?}/${DOCKER_REPOSITORY:?}:${BACKEND_IMAGE_TAG:-latest-cadence-backend}
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DATABASE}
      CORS_ORIGINS: https://cadence.rustify.app
      RUST_LOG: info
    ports:
      - "127.0.0.1:5105:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: ${DOCKER_USERNAME:?}/${DOCKER_REPOSITORY:?}:${FRONTEND_IMAGE_TAG:-latest-cadence-frontend}
    environment:
      API_URL: http://backend:3001
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:5104:3000"
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  cadence_db:
