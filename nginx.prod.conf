server {
    listen 80;
    server_name bookcadence.app;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bookcadence.app;

    ssl_certificate /etc/letsencrypt/live/bookcadence.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookcadence.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:5105;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The client talks to this server directly, so its address is the only
        # one to pass on. Appending would keep whatever the client sent first.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Only Cloudflare may set this, and it is not in front of this server.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:5105/health;
    }

    location / {
        proxy_pass http://127.0.0.1:5104;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The client talks to this server directly, so its address is the only
        # one to pass on. Appending would keep whatever the client sent first.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Only Cloudflare may set this, and it is not in front of this server.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
