server {
    listen 80;
    server_name cadence.rustify.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cadence.rustify.app;

    ssl_certificate /etc/letsencrypt/live/cadence.rustify.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cadence.rustify.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location /api/ {
        proxy_pass http://127.0.0.1:5105;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:5105/health;
    }

    location / {
        proxy_pass http://127.0.0.1:5104;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
