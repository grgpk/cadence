server {
    listen 80;
    server_name cadence.rustify.app;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location / {
        proxy_pass http://127.0.0.1:5104;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The client talks to this server directly, so its address is the only
        # one to pass on. Appending would keep whatever the client sent first.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Only Cloudflare may set this, and it is not in front of this server.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }
}
