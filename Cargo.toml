[workspace]
members = ["backend"]
resolver = "2"

# Strict quality policy. Backend inherits this policy through `lints.workspace`.
# Lint groups come first at negative priority so single-lint overrides win.
[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -2 }
cargo = { level = "warn", priority = -2 }

# Critical safety and correctness lints.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
get_unwrap = "deny"
await_holding_lock = "deny"
await_holding_invalid_type = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
enum_glob_use = "deny"
infinite_loop = "deny"
large_stack_arrays = "deny"
lossy_float_literal = "deny"
float_cmp = "deny"
mem_forget = "deny"
exit = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
mutex_atomic = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
unnecessary_safety_comment = "deny"
# Restriction lints with clear project value.
string_add = "deny"
format_push_string = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
deref_by_slicing = "deny"
read_zero_byte_vec = "deny"
clear_with_drain = "deny"
pathbuf_init_then_push = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
error_impl_error = "deny"
iter_over_hash_type = "deny"
mixed_read_write_in_expression = "deny"
rest_pat_in_fully_bound_structs = "deny"
fn_to_numeric_cast_any = "deny"
as_underscore = "deny"

semicolon_if_nothing_returned = "warn"
redundant_type_annotations = "warn"
unneeded_field_pattern = "warn"
partial_pub_fields = "warn"
same_name_method = "warn"
impl_trait_in_params = "warn"
renamed_function_params = "warn"
str_split_at_newline = "warn"
needless_raw_string_hashes = "warn"

# Quality nudges.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
cast_lossless = "warn"
redundant_clone = "warn"
significant_drop_tightening = "warn"
inefficient_to_string = "warn"
cloned_instead_of_copied = "warn"
manual_let_else = "warn"
trivially_copy_pass_by_ref = "warn"
explicit_iter_loop = "warn"
from_over_into = "warn"
fallible_impl_from = "warn"
clone_on_ref_ptr = "warn"
needless_borrow = "warn"
needless_pass_by_value = "warn"
unused_async = "warn"
empty_structs_with_brackets = "warn"
if_then_some_else_none = "warn"
try_err = "warn"
unnecessary_self_imports = "warn"
branches_sharing_code = "warn"
use_self = "warn"
equatable_if_let = "warn"
manual_string_new = "warn"

# Group lints that conflict with established internal-binary style.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
missing_const_for_fn = "allow"
redundant_pub_crate = "allow"
option_if_let_else = "allow"
cognitive_complexity = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
items_after_statements = "allow"
struct_field_names = "allow"
similar_names = "allow"
match_same_arms = "allow"
duration_suboptimal_units = "allow"
cast_possible_wrap = "allow"
case_sensitive_file_extension_comparisons = "allow"
ref_option = "allow"
ref_option_ref = "allow"
unreadable_literal = "allow"
string_slice = "allow"
map_err_ignore = "allow"
let_underscore_untyped = "allow"
let_underscore_must_use = "allow"
allow_attributes = "allow"
allow_attributes_without_reason = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
irrefutable_let_patterns = "deny"
non_ascii_idents = "deny"
let_underscore_lock = "deny"
unit_bindings = "deny"
macro_use_extern_crate = "deny"
unused_lifetimes = "deny"
single_use_lifetimes = "warn"
unused_qualifications = "warn"
unreachable_pub = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
keyword_idents_2024 = "warn"
elided_lifetimes_in_paths = "warn"
ambiguous_negative_literals = "warn"
redundant_imports = "warn"
meta_variable_misuse = "warn"
unnameable_types = "warn"
unused_crate_dependencies = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "warn"
unescaped_backticks = "warn"
private_intra_doc_links = "warn"
