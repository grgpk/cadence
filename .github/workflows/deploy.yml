name: Deploy Cadence

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: cadence-shared-apps-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ vars.SERVER_IP }}
      DEPLOY_USER: root
      DEPLOY_DIR: /root/cadence
      LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SERVER_IP"
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$SERVER_IP" >> "$HOME/.ssh/known_hosts"

      - name: Deploy main on shared-apps
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$SERVER_IP")
          "${SSH[@]}" "set -e
            cd '$DEPLOY_DIR'
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            test -s .env
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d
          "

      - name: Configure Nginx and TLS
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$SERVER_IP")
          "${SSH[@]}" "set -e
            if [ ! -s /etc/letsencrypt/live/cadence.rustify.app/fullchain.pem ]; then
              test -n '$LETSENCRYPT_EMAIL'
              install -m 0644 '$DEPLOY_DIR/deploy/nginx.cadence.bootstrap.conf' /etc/nginx/conf.d/cadence.rustify.app.conf
              nginx -t
              systemctl reload nginx
              certbot certonly --nginx --non-interactive --agree-tos --email '$LETSENCRYPT_EMAIL' --cert-name cadence.rustify.app -d cadence.rustify.app
            fi
            install -m 0644 '$DEPLOY_DIR/deploy/nginx.cadence.conf' /etc/nginx/conf.d/cadence.rustify.app.conf
            nginx -t
            systemctl reload nginx
          "

      - name: Smoke test
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$SERVER_IP")
          for attempt in $(seq 1 30); do
            if "${SSH[@]}" "curl -fsS http://127.0.0.1:5105/health >/dev/null && curl -fsS http://127.0.0.1:5104/ >/dev/null"; then
              "${SSH[@]}" "curl -fsS --resolve cadence.rustify.app:443:127.0.0.1 https://cadence.rustify.app/health"
              exit 0
            fi
            sleep 2
          done
          "${SSH[@]}" "cd '$DEPLOY_DIR' && docker compose -f docker-compose.prod.yml ps && docker compose -f docker-compose.prod.yml logs --tail=80 backend frontend"
          exit 1
